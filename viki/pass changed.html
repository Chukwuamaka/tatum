<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pass changed.css" />
</head>
<body>
     <div class="page-shell">
      <!-- hero -->
      <section class="hero-panel">
        <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
        <p class="hero-subtitle">No queques.No stress.Just seemless banking.</p>
      </section>
    
       <section class="changed-panel">
  <div class="changed-card">
    <img
      src="images/logo- Tatum Bank 2.svg"
      alt="Tatum bank logo"
      width="117px"
      height="49px"
      class="logo"
    />
 

    <div class="changed-center">
        <span class="success-icon-wrap">
        <span class="success-icon">✓</span>
        </span>
    
      <div class="changed-header">
        <h2>Password Changed!</h2>
        <p>Your password has been successfully updated.</p>
        <p>You can now log in with your new password.</p>
      </div>

      <button type="submit" class="btn-primary">Back to Login</button>
    </div>

    <footer class="changed-footer">
      <p class="footer-item">
        Licenced by CBN
        <img src="images/image 1.png" alt="CBN logo" width="45px" height="25px" />
      </p>
      <p class="footer-item">
        INSURED BY NDIC
        <img src="images/image 2.png" alt="NDIC logo" width="45px" height="25px" />
      </p>
    </footer>
  </div>
</section>
    </div>
</body>
</html>
