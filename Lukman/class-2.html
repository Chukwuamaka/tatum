<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="page-shell">
        <!--Hero section-->
        <section class="hero">
            <h1>Bank Simpler, LiveSmarter</h1>
            <p>No queues. No stress. Just seamless banking.</p>
        </section>
        <section class="login-panel">
            <img src="tatumlogo.png" alt="Tatum Bank Logo" width="117" height="49">
            <div>
                <h2>Log In to Tatum Bank</h2>
                <p>Please enter your Internet Banking details to continue</p>
                <form action="">
                    <input name="user-Id" type="text" placeholder="Email Address or Phone no" required/>
                    <input name="password" type="password" placeholder="Password" required/>
                    <a href="/forgot-password">Forgot Password?</a>
                    <button type="submit">Log In</button>
                    <input type="button" value="Log In">
                </form>
                <div>
                    <div>
                        
                    </div>
                    <p>New to Tatum Bank?<a href="/register">Get Started</a></p>
                    <p>Have a Tatum Bank Account?<a href="activate">Activate account number</a></p>
                </div>
            </div>
            <footer>
                <p>
                    Licensed by CBN
                    <img src="cbnlogo.png" alt="CBN logo" width="27" height="27">
                </p>
                <p>
                    Insured by NDIC
                    <img src="ndiclogo.png" alt="NDIC logo" width="63" height="28">
                </p>
            </footer>
        </section>
    </div>
</body>
</html>
