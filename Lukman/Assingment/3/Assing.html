<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatum Bank</title>
  <link rel="icon" href="favicon-32x32.png">
  <link rel="stylesheet" href="Assing.css">
</head>
<body>
  <main class="page">
    <section class="welcome">
      <div class="welcome-text">
        <h1>Bank Simpler, Live<br>Smarter</h1>
        <p>No queues. No stress. Just seamless banking.</p>
        <div class="slides">
          <span></span>
          <span class="active"></span>
          <span></span>
        </div>
      </div>
    </section>

    <section class="success">
      <img class="logo" src="tatumlogo.png" alt="Tatum Bank">
      <div class="message">
        <div class="check">&#10003;</div>
        <h2>Password Changed!</h2>
        <p>Your password has been successfully updated.<br>You can now log in with your new password.</p>
        <button>Back to Login</button>
      </div>
      <div class="partners">
        <span>Licensed by CBN</span>
        <img src="cbnlogo.png" alt="CBN">
        <span>INSURED BY NDIC</span>
        <img src="NDIC.png" alt="NDIC">
      </div>
    </section>
  </main>
</body>
</html>
