<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tatum Bank | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-label="Tatum Bank login">
      <aside class="hero-panel">
        <div class="hero-image" aria-hidden="true"></div>
        <div class="hero-content">
          <h1>Bank Simpler, Live<br />Smarter</h1>
          <p>No queues. No stress. Just seamless banking.</p>
          <div class="slider-dots" aria-hidden="true">
            <span class="active"></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </aside>
      <section class="form-panel">
        <div class="form-content">
          <a class="brand" href="#" aria-label="Tatum Bank home">
            <img src="tatumlogo.png" alt="Tatum Bank Logo" class="brand-logo" />
          </a>
          <div class="intro">
            <h2>Log In to Tatum Bank</h2>
            <p>Please enter your Internet Banking details to continue</p>
          </div>
          <form>
            <label class="sr-only" for="email">Email address or phone number</label>
            <div class="field">
              <input
                id="email"
                type="text"
                placeholder="Email Address or Phone no"
                autocomplete="username"
              />
              <button type="button" class="quick-login" aria-label="Use quick login">
                ✽
              </button>
            </div>
            <label class="sr-only" for="password">Password</label>
            <div class="field">
              <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
              />
              <button type="button" class="visibility" aria-label="Show password">
                ◉
              </button>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-row">
              <a href="#">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button class="login-button" type="submit">Log In</button>

          </form>

          <!-- Account Links -->
          <div class="account-links">
            <p>New to Tatum Bank? <a href="#">Get Started</a></p>
            <p>Have a Tatum Bank Account? <a href="#">Activate account number</a></p>
          </div>

        </div>

        <!-- Footer with Certifications -->
        <footer>
          <span>Licensed by CBN</span>
          <img src="cbnlogo.png" alt="CBN Logo" class="cbn-logo" />
          <img src="NDIC.png" alt="NDIC Logo" class="ndic-logo" />
        </footer>

      </section>

    </section>

  </main>

  <!-- Scripts -->
  <script src="./script.js"></script>

</body>

</html>
