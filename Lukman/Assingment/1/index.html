<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In to Tatum Bank</title>
  <link rel="icon" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="welcome">
      <div class="welcome-text">
        <h1>Bank Simpler, Live<br>Smarter</h1>
        <p>No queues. No stress. Just seamless banking.</p>
        <div class="dots"><b></b><i></i><i></i></div>
      </div>
    </section>

    <section class="login">
      <div class="form-wrap">
        <img class="logo" src="tatumlogo.png" alt="Tatum Bank">
        <h2>Log In to Tatum Bank</h2>
        <p class="hint">Please enter your Internet Banking details to continue</p>

        <form>
          <label class="field"><input type="text" placeholder="Email Address or Phone no"><span class="mark">✣</span></label>
          <label class="field"><input type="password" placeholder="Password"><span class="eye"></span></label>
          <a class="forgot" href="#">Forgot Password?</a>
          <button type="submit">Log In</button>
        </form>

        <div class="links">
          <p>New to Tatum Bank? <a href="#">Get Started</a></p>
          <p>Have a Tatum Bank Account? <a href="#">Activate account number</a></p>
        </div>
      </div>
      <footer><span>Licensed by CBN <img src="cbnlogo.png" alt="CBN"></span><span>INSURED BY NDIC <img src="NDIC.png" alt="NDIC"></span></footer>
    </section>
  </main>
</body>
</html>
