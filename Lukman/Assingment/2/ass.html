<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatum Bank - Change Password</title>
  <link rel="icon" href="favicon-32x32.png">
  <link rel="stylesheet" href="ass.css">
</head>
<body>
  <div class="page">

    <!-- Left image section -->
    <section class="hero">
      <img src="vibrant smiling African woman with a colorful headwrap wearing a yellow top holding a digital tablet (1).png" alt="Smiling woman using a tablet">
      <div class="hero-dark"></div>

      <div class="hero-text">
        <h1>Bank Simpler, Live Smarter</h1>
        <p>No queues. No stress. Just seamless banking.</p>
      </div>

      <div class="dots">
        <span></span>
        <span class="active"></span>
        <span></span>
      </div>
    </section>

    <!-- Right form section -->
    <main class="form-side">
      <div class="form-box">
        <img class="logo" src="tatumlogo.png" alt="Tatum Bank">

        <h2>Change Password</h2>
        <p class="description">Please enter your new password below</p>

        <form>
          <input type="password" placeholder="New Password" required>
          <input type="password" placeholder="Confirm New Password" required>
          <button type="submit">Reset Password</button>
        </form>

        <div class="links">
          <p>New to Tatum Bank? <a href="#">Get Started</a></p>
          <p>Have a Tatum Bank Account? <a href="#">Activate account number</a></p>
        </div>
      </div>

      <footer>
        <span>Licensed by CBN <img src="cbnlogo.png" alt="CBN logo"></span>
        <i></i>
        <span>INSURED BY NDIC <img src="NDIC.png" alt="NDIC logo"></span>
      </footer>
    </main>
  </div>
</body>
</html>
