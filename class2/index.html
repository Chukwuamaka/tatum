<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatum Bank - Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
</head>

<body>
    <div class="page-shell">
        <!-- Hero Section -->
        <section class="hero-panel">
            <div class="hero-text">
                <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
                <p class="hero-subtitle">No queues. No stress. Just seamless banking.</p>
            </div>
            <div class="hero-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </section>

        <section class="login-panel">
            <div class="login-inner">
                <img class="logo" src="images/logo- Tatum Bank 2.svg" alt="Tatum bank logo">

                <div class="login-content">
                    <div class="login-heading">
                        <h2>Log In to Tatum Bank</h2>
                        <p>Please enter your Internet Banking details to continue</p>
                    </div>

                    <form action="" class="login-form">
                        <div class="input-wrap">
                            <input type="text" placeholder="Email Address or Phone no" name="userId" required />
                            <img class="input-icon" src="images/Img.png" alt="Tatum bank logo">
                        </div>

                        <div class="input-wrap">
                            <input type="password" placeholder="Password" name="password" required />
                            <img class="input-icon eye-icon" src="images/eye.png" alt="Toggle password visibility">
                        </div>

                        <a href="#" class="forgot-link">Forgot Password?</a>

                        <button type="submit">Log In</button>
                    </form>

                    <div class="login-footer-links">
                        <p>New to Tatum Bank? <a href="#">Get Started</a></p>
                        <p>Have a Tatum Bank Account? <a href="#">Activate account number</a></p>
                    </div>
                </div>

                <footer class="license-footer">
                    <p>
                        Licensed by CBN
                        <img src="images/image 1 (1).png" alt="CBN logo" width="27" height="27">
                    </p>

                    <p>
                        INSURED BY NDIC
                        <img src="images/image 2.png" alt="NDIC logo" width="63" height="28">
                    </p>
                </footer>
            </div>
        </section>

    </div>
</body>

</html>
