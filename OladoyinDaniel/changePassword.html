<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grandpa">
        <section class="hero2">
            <div class="hero-content">
                <h1 class="h-title">Bank Simpler Live, Smarter</h1>
                <p class="h-sub">No queues. No stress. Just seamless banking.</p>
                <div class="slider-indicators">
                    <span></span>
                    <span class="active"></span>
                    <span></span>
                </div>
            </div> 
        </section>

        <!-- Right Side -->

        <section class="sized-box">
            <div class="login-container">
                <div>
                    <img src="images/tatum_logo.svg" alt="Tatum Logo" class="tatum-logo">
                </div>
                <div class="login-heading">
                    <h1>Change Password</h1>
                    <p>Please enter your new password below</p>
                </div>

                <form action="" class="login-form">
                    <div class="input-container">
                        <input type="text" placeholder="New Password">
                    </div>
                    <div class="input-container">
                        <input type="text" placeholder="Confirm Password">
                    </div>
                    <div class="button">
                        <button>Reset Password</button>
                    </div>
                
                </form>

                <!-- Account Links -->
                <div class="account-links">
                    <p>
                        New to Tatum Bank?
                        <a href="#">
                            Get Started
                        </a>
                    </p>
                    <p>
                        Have a Tatum Bank Account?
                        <a href="#">
                            Activate account number
                        </a>
                    </p>
                </div>

                <!-- Footer -->
                <footer>
                    <div class="footer-item">
                        <span>
                            Licensed by CBN
                        </span>
                        <img src="images/cbn_logo.svg" width="27px" height="27px" alt="CBN logo">
                    </div>

                    <div class="footer-item">
                        <span>
                            INSURED BY NDIC
                        </span>
                        <img src="images/ndic_logo.svg" width="63px" height="28px" alt="NDIC logo">
                    </div>
                </footer>

            </div>
            
        </section>
    </div>
    
    

</body>
</html>
