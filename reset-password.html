<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Tatum Bank</title>
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <link rel="manifest" href="/public/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="reset-password.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-panel">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <h1>Bank Simpler, Live Smarter</h1>
          <p>No queues. No stress. Just seamless banking.</p>
          <div class="hero-dots" aria-hidden="true">
            <span class="hero-dot active"></span>
            <span class="hero-dot"></span>
            <span class="hero-dot"></span>
          </div>
        </div>
      </section>

      <section class="right-panel">
        <div class="brand">
          <a href="#">
            <img
              class="brand-logo"
              src="/images/tatum-bank-logo.svg"
              alt="Tatum Bank logo"
            />
          </a>
        </div>

        <div class="form-area">
          <div class="copy">
            <h1 class="title">Reset Your Password</h1>
            <p class="subtitle">
              Enter the email address associated with your account and we'll
              send you a link to reset your password.
            </p>
          </div>

          <div>
            <form class="form" action="#" method="post" novalidate>
              <div>
                <label class="sr-only" for="email">
                  Email Address or Phone no
                </label>
                <input
                  id="email"
                  name="email"
                  type="text"
                  placeholder="Email Address or Phone no"
                  autocomplete="username"
                />
              </div>

              <button type="submit" class="primary-btn">Send Reset Link</button>
            </form>
            <div class="links">
              <p>Remember your password? <a href="/">Back to Login</a></p>
            </div>
          </div>
        </div>

        <footer
          class="trust-row"
          aria-label="Licensed and insured partnerships"
        >
          <div class="trust-item">
            <span>Licensed by CBN</span>
            <img
              src="/images/cbn-logo.png"
              alt="CBN licensed badge"
              class="cbn-logo"
            />
          </div>
          <div class="trust-item">
            <span class="insured-by-ndic">Insured by ndic</span>
            <img
              src="/images/ndic-logo.png"
              alt="NDIC logo"
              class="ndic-logo"
            />
          </div>
        </footer>
      </section>
    </main>
  </body>
</html>
