<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Arimo:ital,wght@0,400..700;1,400..700&family=Jim+Nightshade&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pswrdchanged.css">
</head>
<body>
   <div class="page-shell">
    <!-- Hero section -->
    <section class="hero">
        <div class="hero-overlay">
            <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
            <p class="hero-description">No queues. No stress. Just seamless banking.</p>
        </div>
    </section>
    <section class="login-pannel">
        <div class="img-container">
            <img src="images/logo- Tatum Bank 2.svg" alt="Tatum bank logo" width="117" height="49">
        </div>
        
        <div>
            <div class="login-pannel-headers">
                <img src="images/Background.png" alt="" width="80px" height="80px">
                <h2>Password Changed!</h2>
                <p>Your password has be sucessfully updated. <br> You can now log in with your new password.</p>
            </div>
            <form action="">
                <div class="input-container">
                    <button type="submit">Back to Login</button>
                </div>
                <footer>
                    <p>Licensed by CBN <img src="images/CBNIMG.svg" alt="CBN image" width="27" height="27"></p>
                    <p>INSURED BY NDIC <img src="images/NDICimg.svg" alt="CBN image" width="63" height="28"></p>
                </footer>
            </form>
        </div>
    </section>
   </div> 
</body>
</html>
