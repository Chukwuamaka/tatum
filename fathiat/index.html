<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="icon/ico" href="/favicon.ico">
</head>
<body>
    <div class="page-shell">
        <!-- Hero Section -->
        <section class="hero-panel">
            <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
            <p class="hero-p">No queues. No stress. Just seamless banking</p>
        </section>
        <section class="login-panel">
            <div>                                                    
                <div class="tatum-logo">
                    <img src="/images/tatum icon.svg" alt="Tatum bank logo" width="117" height="49"/>
                </div>
                <div class="login-panel-heading">
                    <h2>Log In to Tatum Bank</h2>
                    <p>Please enter your Internet Banking details to continue</p>
                </div>
                <form>
                    <input type="text" name="username" placeholder="Email Address or Phone no" required />
                    <input type="password" name="password" placeholder="Password" required />
                    <a href="/forgot-password">Forgot Password?</a>
                    <button type="submit">Log In</button>
                </form>
                <div class="login-panel-options">
                    <p style="padding-bottom: 6px;">New to Tatum Bank? <a href="/register">Get Started</a></p>
                    <p>Have a Tatum Bank Account? <a href="/activate">Activate account number</a></p>
                </div>
            </div>
            <footer class="login-panel-footer">
                <p>
                    Licensed by CBN
                    <img src="/images/cbn.png" alt="CBN Logo" width="20" height="20"/>
                </p>
                <p>
                    INSURED BY NDIC
                    <img src="/images/ndic.png" alt="NDIC Logo" height="22"/>
                </p>
            </footer>
        </section>
    </div>
</body>
</html>
