<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/fathiat/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/fathiat/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/fathiat/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/fathiat/favicon-16x16.png">
    <link rel="icon" type="icon/ico" href="/fathiat/favicon.ico">
</head>

<body>
    <div class="page-shell">
        <!-- Hero Section -->
        <section class="hero-panel2">
            <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
            <p class="hero-p">No queues. No stress. Just seamless banking</p>
        </section>
        <section class="login-panel">
            <div>
                <div class="tatum-logo">
                    <img src="/fathiat/images/tatum icon.svg" alt="Tatum bank logo" width="117" height="49" />
                </div>
                <div class="login-panel-heading">
                    <h2>Change Password</h2>
                    <p>Please enter your new password below</p>
                </div>
                <form>
                    <div class="input-field">
                        <input type="password" name="new-password" placeholder="New password" required />
                        <span class="input-icon eye" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor"
                                    stroke-width="1.6" stroke-linejoin="round" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
                            </svg>
                        </span>
                    </div>
                    <div class="input-field">
                        <input type="password" name="confirm-password" placeholder="Confirm New Password" required />
                        <span class="input-icon eye" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor"
                                    stroke-width="1.6" stroke-linejoin="round" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
                            </svg>
                        </span>
                    </div>
                    <button type="submit" href="password-changed.html">Reset Password</button>
                </form>
                <div class="login-panel-options">
                    <p style="padding-bottom: 6px;">New to Tatum Bank? <a href="/register">Get Started</a></p>
                    <p>Have a Tatum Bank Account? <a href="/activate">Activate account number</a></p>
                </div>
            </div>
            <footer class="login-panel-footer">
                <p>
                    Licensed by CBN
                    <img src="/fathiat/images/cbn.png" alt="CBN Logo" width="20" height="20" />
                </p>
                <p>
                    INSURED BY NDIC
                    <img src="/fathiat/images/ndic.png" alt="NDIC Logo" height="22" />
                </p>
            </footer>
        </section>
    </div>
</body>

</html>
