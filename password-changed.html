<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Changed | Tatum Bank</title>
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <link rel="manifest" href="/public/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="password-changed.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <main class="hero-layout">
        <section class="hero-panel">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <h1>Bank Simpler, Live Smarter</h1>
            <p>No queues. No stress. Just seamless banking.</p>
            <div class="hero-dots" aria-hidden="true">
              <span class="hero-dot active"></span>
              <span class="hero-dot"></span>
              <span class="hero-dot"></span>
            </div>
          </div>
        </section>

        <section class="right-panel">
          <div class="brand">
            <a class="brand" href="#">
              <img
                class="brand-logo"
                src="/images/tatum-bank-logo.svg"
                alt="Tatum Bank logo"
              />
            </a>
          </div>

          <div class="main-content">
            <div class="icon-and-copy">
              <p class="icon-container">
                <img
                  src="/images/checkmark-icon.svg"
                  alt="Checkmark icon"
                  class="checkmark-icon"
                />
              </p>
              <div class="copy">
                <p class="main-copy">Password changed!</p>
                <p class="sub-copy">
                  Your password has been successfully updated. You can now log
                  in with your new password.
                </p>
              </div>
            </div>
            <a href="/" class="back-to-login-btn">Back to Login</a>
          </div>

          <footer
            class="trust-row"
            aria-label="Licensed and insured partnerships"
          >
            <div class="trust-item">
              <span>Licensed by CBN</span>
              <img
                src="/images/cbn-logo.png"
                alt="CBN licensed badge"
                class="cbn-logo"
              />
            </div>
            <div class="trust-item">
              <span class="insured-by-ndic">Insured by ndic</span>
              <img
                src="/images/ndic-logo.png"
                alt="NDIC logo"
                class="ndic-logo"
              />
            </div>
          </footer>
        </section>
      </main>
    </div>
  </body>
</html>
