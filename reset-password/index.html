<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatum Bank - Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
</head>

<body>
    <div class="page-shell">
        <!-- Hero Section -->
        <section class="hero-panel">
            <div class="hero-text">
                <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
                <p class="hero-subtitle">No queues. No stress. Just seamless banking.</p>
            </div>
            <div class="hero-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot active"></span>
            </div>
        </section>

        <section class="reset-panel">
            <div class="reset-inner">
                <img class="logo" src="/images/logo- Tatum Bank 2.svg" alt="Tatum bank logo">

                <div class="reset-content">
                    <div class="reset-first-child">
                        <div class="reset-heading">
                            <h2>Reset Your Password</h2>
                            <p>Enter the email address associated with your account and
                                we'll send you a link to reset your password.</p>
                        </div>

                        <form action="" class="reset-form">
                            <div class="input-wrap">
                                <input type="text" placeholder="Email Address" name="userId" required />
                            </div>
                            <button type="submit">Send Reset Link</button>
                        </form>

                        <div class="reset-footer-links">
                            <p>Remember your password? <a href="#">Back to Log In</a></p>
                        </div>
                    </div>
                </div>

                <footer class="license-footer">
                    <p>
                        Licensed by CBN
                        <img src="/images/image 1 (1).png" alt="CBN logo" width="27" height="27">
                    </p>

                    <p>
                        INSURED BY NDIC
                        <img src="/images/image 2.png" alt="NDIC logo" width="63" height="28">
                    </p>
                </footer>
            </div>
        </section>

    </div>
</body>

</html>
