<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | Tatum Bank</title>
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <link rel="manifest" href="/public/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="change-password.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="hero-layout">
        <section class="hero-panel">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <h1>Bank Simpler, Live Smarter</h1>
            <p>No queues. No stress. Just seamless banking.</p>
            <div class="hero-dots" aria-hidden="true">
              <span class="hero-dot active"></span>
              <span class="hero-dot"></span>
              <span class="hero-dot"></span>
            </div>
          </div>
        </section>

        <section class="right-panel">
          <div class="form-area">
            <div class="brand">
              <a class="brand" href="#">
                <img
                  class="brand-logo"
                  src="/images/tatum-bank-logo.svg"
                  alt="Tatum Bank logo"
                />
              </a>
            </div>

            <div class="copy">
              <h1 id="title">Change Password</h1>
              <p class="subtitle">Please enter your new password below</p>
            </div>

            <form class="form" action="#" method="post" novalidate>
              <label class="sr-only" for="password">New Password</label>
              <div class="input-group">
                <input
                  id="new-password"
                  name="new-password"
                  type="password"
                  placeholder="New Password"
                  autocomplete="current-password"
                />
                <div class="input-icon">
                  <img
                    src="/images/password-input-icon.svg"
                    alt="Show password icon"
                  />
                </div>
              </div>

              <label class="sr-only" for="password">Confirm New Password</label>
              <div class="input-group">
                <input
                  id="confirm-new-password"
                  name="confirm-new-password"
                  type="password"
                  placeholder="Confirm New Password"
                  autocomplete="current-password"
                />
                <div class="input-icon">
                  <img
                    src="/images/password-input-icon.svg"
                    alt="Show password icon"
                  />
                </div>
              </div>

              <div class="form-link-row">
                <a class="forgot-password-link" href="/forgot-password">
                  Reset Password
                </a>
              </div>

              <button type="submit" class="primary-btn">Log In</button>
            </form>

            <div class="links">
              <p>New to Tatum Bank? <a href="#">Get Started</a></p>
              <p>
                Have a Tatum Bank Account?
                <a href="#">Activate account number</a>
              </p>
            </div>
          </div>

          <footer
            class="trust-row"
            aria-label="Licensed and insured partnerships"
          >
            <div class="trust-item">
              <span>Licensed by CBN</span>
              <img
                src="/images/cbn-logo.png"
                alt="CBN licensed badge"
                class="cbn-logo"
              />
            </div>
            <div class="trust-item">
              <span class="insured-by-ndic">Insured by ndic</span>
              <img
                src="/images/ndic-logo.png"
                alt="NDIC logo"
                class="ndic-logo"
              />
            </div>
          </footer>
        </section>
      </main>
    </div>
  </body>
</html>
