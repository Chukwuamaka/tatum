<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="./images/icon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./changePassword.css">
</head>
<body>
    <div class="container">
        <!-- Hero section -->
        <section class="hero">
            <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
            <p class="hero-description">No queues. No stress. Just seamless banking.</p>
        </section>
        <section class="login-section">
            <img class="logo" src="../images/Tatum-bank-logo.svg" alt="Tatum Bank Logo">
            <div class="login-wrap">
                <div class="login-tab">
                    <h2>Change Password</h2>
                    <p>Please enter your new password below</p>

                    <form action="">
                        <input class="input-user" name="userId" type="text" placeholder="Email address or Phone No" required>
                        <input class="input-pass" name="password" type="password" placeholder="Enter your password">
                        <a class="forgot-link" href="/forgot-password">Forgot password?</a>
                        <button type="submit">Reset Password</button>
                    </form>
                    <div class="alt-links">
                        <p>New to Tatum Bank? <a href="/register">Get Started</a></p>
                        <p>Have a Tatum Bank Account? <a href="/activate">Activate account number</a></p>
                    </div>
                </div>
            </div>
            <footer>
                <p>
                    Licensed by CBN.
                    <img src="../images/CBN-logo.png" alt="CBN Logo">
                </p>
                <p>
                    INSURED by NDIC.
                    <img src="../images/NDIC-logo.png" alt="NDIC Logo">
                </p>
            </footer>
        </section>
    </div>
</body>
</html>
