<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="./images/icon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./passwordchanged.css">
</head>
<body>
    <div class="container">
        <!-- Hero section -->
        <section class="hero">
            <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
            <p class="hero-description">No queues. No stress. Just seamless banking.</p>
        </section>
        <section class="password-changed-section">
            <img class="logo" src="../images/Tatum-bank-logo.svg" alt="Tatum Bank Logo">
            <div class="success-icon">
                <img class="" src="../images/done.png" alt="Success Icon">
                    <h2> Password Changed!</h2>
                    <p>Your password has been successfully updated.<br/>
                        You can now log in with your new password.</p>

                    <button type="submit">Back to Login</button>

            </div>
            <footer>
                <p>
                    Licensed by CBN.
                    <img src="../images/CBN-logo.png" alt="CBN Logo">
                </p>
                <p>
                    INSURED by NDIC.
                    <img src="../images/NDIC-logo.png" alt="NDIC Logo">
                </p>
            </footer>
        </section>
    </div>
</body>
</html>
