<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./class2.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon_io/favicon-16x16.png"
    />
    <link rel="icon" href="favicon_io/favicon.ico" />
    <title>Tatum Bank Class 2</title>
  </head>
  <body>
    <div class="page-shell">
      <section class="hero">
        <h1>Bank Simpler, Live Smarter</h1>
        <p>No queues, No Stress, Just seamless banking</p>
      </section>
      <section class="login">
        <img
          class="TatumLogo"
          src="./img/logo- Tatum Bank 2.svg"
          alt="Tatum Logo"
        />

        <div>
          <div class="logInText">
            <h2>Log In to Tatum Bank</h2>
            <p>Please enter your Internet Banking details to contine</p>
          </div>

          <form action="">
            <input
              class="details"
              type="text"
              name="userId"
              placeholder="Email Address or Phone no"
              required
            />

            <input
              class="details"
              type="password"
              name="password"
              placeholder="Password"
              required
            />

            <a href="#" class="forgotP"> Forgot Password?</a>

            <input class="buttonInp" type="button" value="Log In" />
          </form>

          <div class="otherTexts">
            <div>
              <div class="OTDetails">
                <p>New to Tatum Bank?</p>
                <a href="#">Get Started</a>
              </div>
              <div class="OTDetails">
                <p>Have a Tatum Bank Account?</p>
                <a href="#">Activate account number</a>
              </div>
            </div>
          </div>
        </div>

        <footer>
          <div>
            <p>
              Licensed by CBN

              <img src="./img/CBN.png" alt="CBN logo" />
            </p>
          </div>

          <div>
            <p>
              INSURED BY NDIC

              <img src="./img/NDIC.png" alt="NDIC logo" />
            </p>
          </div>
        </footer>
      </section>
    </div>
  </body>
</html>
