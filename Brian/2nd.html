<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="2nd.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <div class="container">
      <section class="grid1 hero">
        <!-- <img src="background.png" alt="Background Image" class="background" /> -->
        <div class="" id="headline">
          <h1 class="headlinehead">Bank Simpler, Live Smarter</h1>
          <p class="headlinepar">No queues, No stress, just seamless banking</p>
        </div>
      </section>
      <section class="grid2">
        <img src="logo-BVkjmgxH.svg" alt="Banking Image" class="logo" />
        <h2 class="h2head">Log In to Tatum Bank</h2>
        <p class="h2par">Please enter your banking details to continue</p>

        <form action="" class="loginform">
          <div class="formgroup">
            <label class="loginlabel" for="username"
              >Email or Phone Number</label
            >
            <input
              class="logininput"
              type="text"
              id="username"
              name="username"
              required
              placeholder="Email or Phone Number"
            />
            <img src="/Vector.svg" alt="" class="loginicons" />
          </div>
          <div class="formgroup">
            <label class="loginlabel" for="password">Password</label>
            <input
              class="logininput"
              type="password"
              id="password"
              name="password"
              required
              placeholder="Password"
            />
            <img src="/Img.svg" alt="" class="loginicons" />
          </div>
          <a href="#" class="forgotpassword">Forgot Password?</a>
          <button type="submit" class="loginButton">Log In</button>
        </form>

        <div>
          <p class="newtoTatum loginsubfooter">
            New to Tatum? <a href="#">Get Started</a>
          </p>
          <p class="loginsubfooter">
            Have a Tatum bank Account? <a href="">Activate Phone Number</a>
          </p>
        </div>
        <footer class="loginfooter">
          <p class="loginfooterelement">
            Licenced by CBN
            <img src="/image1.png" alt="" />
          </p>
          <p class="loginfooterelement">
            Insured by NDIC
            <img src="/image2.png" alt="" />
          </p>
        </footer>
      </section>
    </div>
  </body>
</html>
