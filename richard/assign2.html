<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assign2.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
</head>

<body>
    <div class="page-shell">
        <!--Hero section-->
        <section class="hero">
            <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
            <p class="hero-subtitle">No queues. No stress. Just seamless banking.</p>
            <div class="overlay"></div>
        </section>
        <!--Login section-->
        <section class="login-panel">
            <img src="images/logo- Tatum Bank 2.svg" alt="Tatum Bank Logo" width="117" height="49" class="logo">
            <div class="body">
                <img src="images/Background (1).png" width="64px" height="64px" class="mail">
                <div class="overlay"></div>
                <div class="info">
                    <h2>Check Your Email</h2>
                    <p class="paragraph">We’ve sent a password reset link to your email address. Please follow the link in the email to reset your password.</p>
                </div>
                <div class="form-section">
                    <form action="" class="form">
                        <button type="submit" class="submit-button">Open Email App</button>
                        <p class="text">Didn't receive the email?<a href="/register">Resend link</a></p>
                    </form>
                </div>
                <a href="" class="Login">Back to Log In</a>
            </div>
            <footer>
                <p>
                    Licensed by CBN
                    <img src="images/cbn-logo.png" alt="CBN logo" class="png" 27" height="27">
                </p>
                <p>
                    Insured by NDIC
                    <img src="images/ndic-logo.png" alt="NDIC logo" class="png" width="63" height="28">
                </p>
            </footer>
    </div>
    </section>
    </div>
</body>

</html>
