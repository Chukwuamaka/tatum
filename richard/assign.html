<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assign.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
</head>

<body>
    <div class="page-shell">
        <!--Hero section-->
        <section class="hero">
            <h1 class="hero-title">Bank Simpler, Live Smarter</h1>
            <p class="hero-subtitle">No queues. No stress. Just seamless banking.</p>
            <div class="overlay"></div>
        </section>
        <!--Login section-->
        <section class="login-panel">
            <img src="images/logo- Tatum Bank 2.svg" alt="Tatum Bank Logo" width="117" height="49" class="logo">
            <div class="body">
                <h2 id="heading" class="tatum">Reset Your Password</h2>
                <p class="paragraph">Enter the email address associated with your account and we'll send you a link to reset your password.</p>
                <div class="form-section">
                    <form action="" class="form">
                        <input class="form-input" name="user-Id" type="text" placeholder="Email Address or Phone no" required />
                        <button type="submit" class="submit-button">Send Reset Link</button>
                    </form>
                    <p class="text">Remember your password?<a href="/register">Back to Log In</a></p>
                </div>
            </div>
            <footer>
                <p>
                    Licensed by CBN
                    <img src="images/cbn-logo.png" alt="CBN logo" class="png" 27" height="27">
                </p>
                <p>
                    Insured by NDIC
                    <img src="images/ndic-logo.png" alt="NDIC logo" class="png" width="63" height="28">
                </p>
            </footer>
    </div>
    </section>
    </div>
</body>

</html>
