<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tatum Bank</title>
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <link rel="manifest" href="/public/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="hero-layout" aria-labelledby="login-title">
        <section class="hero-panel">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <h1>Bank Simpler, Live Smarter</h1>
            <p>No queues. No stress. Just seamless banking.</p>
            <div class="hero-dots" aria-hidden="true">
              <span class="hero-dot active"></span>
              <span class="hero-dot"></span>
              <span class="hero-dot"></span>
            </div>
          </div>
        </section>

        <section class="login-panel" aria-labelledby="login-title">
          <div class="login-card">
            <div class="login-brand">
              <a class="brand" href="#">
                <img
                  class="brand-logo"
                  src="https://www.figma.com/api/mcp/asset/0b348e4b-30bb-40e8-ab7e-6f873dde06c5.svg"
                  alt="Tatum Bank logo"
                />
              </a>
            </div>

            <div class="login-copy">
              <h1 id="login-title">Log In to Tatum Bank</h1>
              <p class="login-subtitle">
                Please enter your Internet Banking details to continue
              </p>
            </div>

            <form class="login-form" action="#" method="post" novalidate>
              <label class="sr-only" for="email">
                Email Address or Phone no
              </label>
              <div class="input-group">
                <input
                  id="email"
                  name="email"
                  type="text"
                  placeholder="Email Address or Phone no"
                  autocomplete="username"
                />
                <div class="input-icon">
                  <img
                    src="https://www.figma.com/api/mcp/asset/b1289388-3b2b-4ac9-8f30-17e0589ec8ec.svg"
                    alt="Email icon"
                  />
                </div>
              </div>

              <label class="sr-only" for="password">Password</label>
              <div class="input-group">
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Password"
                  autocomplete="current-password"
                />
                <div class="input-icon">
                  <img
                    src="https://www.figma.com/api/mcp/asset/3c9a09f6-aba7-421c-88d1-2b5e27f89379.svg"
                    alt="Show password icon"
                  />
                </div>
              </div>

              <div class="form-link-row">
                <a class="forgot-password-link" href="/forgot-password">
                  Forgot Password?
                </a>
              </div>

              <button type="submit" class="primary-btn">Log In</button>
            </form>

            <div class="login-links">
              <p>New to Tatum Bank? <a href="#">Get Started</a></p>
              <p>
                Have a Tatum Bank Account?
                <a href="#">Activate account number</a>
              </p>
            </div>
          </div>

          <footer
            class="trust-row"
            aria-label="Licensed and insured partnerships"
          >
            <div class="trust-item">
              <span>Licensed by CBN</span>
              <img
                src="https://www.figma.com/api/mcp/asset/937dacad-e04e-41c8-8bd1-a5dfe1df8e5a.png"
                alt="CBN licensed badge"
                class="cbn-logo"
              />
            </div>
            <div class="trust-item">
              <span class="insured-by-ndic">Insured by ndic</span>
              <img
                src="https://www.figma.com/api/mcp/asset/243bdeff-fb85-4029-a1ec-94618eea9962.png"
                alt="NDIC logo"
                class="ndic-logo"
              />
            </div>
          </footer>
        </section>
      </main>
    </div>
  </body>
</html>
